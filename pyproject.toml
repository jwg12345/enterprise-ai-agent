[project]
name = "enterprise-ai-agent"
version = "0.1.0"
description = "기업 업무 대응 AI Agent — M1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "streamlit==1.63.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["ai-service", "demo-ui"]
testpaths = ["ai-service/tests", "demo-ui/tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
