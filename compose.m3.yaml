# PostgreSQL 영속성 검사용 일회성 서비스. 기존 AI/UI 실행 설정은 변경하지 않습니다.
services:
  checkpoint-check:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: ai-service/Dockerfile.checkpoint
    environment:
      AGENT_DB_HOST: postgres
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?Run scripts/init_env.py}
    depends_on:
      postgres:
        condition: service_healthy
